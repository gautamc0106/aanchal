<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aanchal, I have a question 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4f8; --b1:#ffc4da; --b2:#e3ccff; --b3:#ffdcc2;
  --glass:rgba(255,255,255,.58); --edge:rgba(255,255,255,.9); --line:rgba(160,87,122,.35);
  --text:#6b2748; --sub:#a0577a; --g1:#ff7aa8; --g2:#ff9d7a; --shadow:rgba(255,122,168,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a0e1e; --b1:#6a2a55; --b2:#3d2a73; --b3:#6b3a3a;
    --glass:rgba(60,30,62,.55); --edge:rgba(255,200,230,.2); --line:rgba(255,190,220,.4);
    --text:#ffdbe9; --sub:#f0a8c6; --shadow:rgba(255,122,168,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0e1e; --b1:#6a2a55; --b2:#3d2a73; --b3:#6b3a3a;
  --glass:rgba(60,30,62,.55); --edge:rgba(255,200,230,.2); --line:rgba(255,190,220,.4);
  --text:#ffdbe9; --sub:#f0a8c6; --shadow:rgba(255,122,168,.3); color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  font-family:"Quicksand","Nunito","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.85;animation:drift 14s ease-in-out infinite alternate;z-index:0}
.blob:nth-child(1){width:55vmax;height:55vmax;background:var(--b1);top:-18vmax;left:-14vmax}
.blob:nth-child(2){width:50vmax;height:50vmax;background:var(--b2);bottom:-16vmax;right:-12vmax;animation-delay:-5s}
.blob:nth-child(3){width:38vmax;height:38vmax;background:var(--b3);top:35%;left:55%;animation-delay:-9s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}

.card{
  position:relative;z-index:2;width:min(90vw,410px);text-align:center;
  padding:34px 26px 38px;border-radius:34px;
  background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 20px 60px var(--shadow), inset 0 1px 0 var(--edge);
  animation:pop .8s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes pop{from{transform:scale(.7) translateY(40px);opacity:0}}
.spark{position:absolute;color:var(--g1);font-size:16px;animation:twinkle 2.4s ease-in-out infinite}
.spark:nth-of-type(1){top:16px;left:22px}
.spark:nth-of-type(2){top:46px;right:26px;font-size:12px;animation-delay:-.8s}
.spark:nth-of-type(3){bottom:22px;left:34px;font-size:12px;animation-delay:-1.6s}
@keyframes twinkle{50%{transform:scale(1.6) rotate(20deg);opacity:.4}}

.badge{
  position:relative;width:112px;height:112px;margin:0 auto 14px;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#fff,var(--b1));
  box-shadow:0 12px 30px var(--shadow), inset 0 0 0 6px rgba(255,255,255,.55);
}
.badge::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--g1);opacity:0;animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.7}to{transform:scale(1.35);opacity:0}}
.bear{font-size:62px;line-height:1;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}

.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--sub);font-weight:700;margin-bottom:6px}
h1{font-family:"Dancing Script","Brush Script MT",cursive;font-size:44px;line-height:1.1;margin:0 0 10px;font-weight:700}
p{margin:0 auto 26px;color:var(--sub);font-size:16px;line-height:1.55;max-width:320px;font-weight:500}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;min-height:76px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;transition:transform .2s ease,background .2s}
#yes{
  position:relative;overflow:hidden;padding:14px 32px;font-size:18px;color:#fff;
  background:linear-gradient(135deg,var(--g1),var(--g2));
  animation:beat 1.6s ease-in-out infinite;
}
#yes::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
@keyframes beat{0%,100%{box-shadow:0 8px 20px var(--shadow)}50%{box-shadow:0 0 0 9px transparent,0 10px 30px var(--g1)}}
#no{padding:12px 24px;font-size:15px;color:var(--sub);background:transparent;border:1.5px solid var(--line)}
#no:hover{background:rgba(255,255,255,.35)}

.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-8deg)}40%{transform:translateX(10px) rotate(8deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:txt .45s ease}
@keyframes txt{from{transform:scale(.8);opacity:0;filter:blur(4px)}}
#done .bear{animation:spin 1s ease,bob 2.2s 1s ease-in-out infinite}
@keyframes spin{from{transform:scale(0) rotate(-360deg)}}
#done h1{animation:wig 1s .6s ease both}
@keyframes wig{30%{transform:rotate(-4deg) scale(1.1)}60%{transform:rotate(4deg) scale(1.1)}}

.heart{position:fixed;top:-40px;z-index:1;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.burst{position:fixed;z-index:9;pointer-events:none;font-size:20px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.peek{position:absolute;z-index:4;width:92px;padding:6px 6px 20px;background:#fff;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.22);pointer-events:none}
.peek img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;transition:opacity .35s}
.p1{top:-34px;left:-12px;transform:rotate(-9deg)}
.p2{bottom:-30px;right:-12px;transform:rotate(8deg)}
#done{width:min(92vw,470px);max-height:92vh;overflow-y:auto}
.gal{display:flex;gap:16px;overflow-x:auto;padding:22px 18px 30px;margin:0 -10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.pol{flex:0 0 140px;position:relative;background:#fff;padding:8px 8px 28px;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.2);scroll-snap-align:center;transform:rotate(var(--r));animation:drop .8s cubic-bezier(.2,1.2,.4,1) both}
.pol:nth-child(odd){--r:-4deg}.pol:nth-child(even){--r:5deg}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px}
.pol::after{content:"♥";position:absolute;bottom:6px;left:0;right:0;font-size:14px;color:var(--g1)}
@keyframes drop{from{transform:translateY(-160px) rotate(calc(var(--r)*5));opacity:0}to{transform:translateY(0) rotate(var(--r));opacity:1}}
.hint{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin:-8px 0 0;font-weight:700}
.hidden{display:none}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<div class="blob"></div><div class="blob"></div><div class="blob"></div>

<div class="card" id="ask">
  <span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span>
  <div class="peek p1"><img alt=""></div><div class="peek p2"><img alt=""></div>
  <div class="badge"><div class="bear" id="face">🧸</div></div>
  <div class="eyebrow">a little question</div>
  <h1 id="title">Heyyy Aanchal 💕</h1>
  <p id="sub">We’ve been on a few dates and I’ve loved every one. Will you be my girlfriend? 🥺</p>
  <div class="btns">
    <button id="yes">Yes 💖</button>
    <button id="no">No</button>
  </div>
</div>

<div class="card hidden" id="done">
  <span class="spark">✦</span><span class="spark">✦</span><span class="spark">✦</span>
  <div class="badge"><div class="bear">🥰</div></div>
  <div class="eyebrow">she said yes</div>
  <h1>YAYYY, Aanchal! 🎉</h1>
  <p>You just made me the happiest person ever. I can’t wait for so many more dates with you 💕</p>
  <div class="gal" id="gal"></div>
  <div class="hint">our little memories ♥</div>
</div>

const gal=document.getElementById('gal');
PHOTOS.forEach((src,i)=>{
  const d=document.createElement('div'); d.className='pol';
  d.style.animationDelay=(0.5+i*0.18)+'s';
  const im=document.createElement('img'); im.src=src; im.alt='Us'; d.appendChild(im); gal.appendChild(d);
});
// two little polaroids peeking out of the question card, swapping photos
const pk=[...document.querySelectorAll('.peek img')]; let pi=0;
function showPeeks(){
  pk.forEach((im,k)=>{
    im.style.opacity=0;
    setTimeout(()=>{im.src=PHOTOS[(pi+k*2)%PHOTOS.length]; im.style.opacity=1;},350);
  });
  pi=(pi+1)%PHOTOS.length;
}
showPeeks(); setInterval(showPeeks,3200);

// soft floating hearts and sparkles in the background
const colors=['#ff7aa8','#ffb3cc','#ff9d7a','#d9a7ff','#ffffff'];
function rain(count,fast){
  for(let i=0;i<count;i++){
    const h=document.createElement('div');
    h.className='heart';
    h.textContent=Math.random()<.8?'♥':'✦';
    h.style.color=colors[Math.floor(Math.random()*colors.length)];
    h.style.opacity=.45+Math.random()*.4;
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(14+Math.random()*28)+'px';
    h.style.animationDuration=(fast?2+Math.random()*2:8+Math.random()*8)+'s';
    h.style.animationDelay=(Math.random()*(fast?1:6))+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),18000);
  }
}
rain(16,false);
setInterval(()=>rain(3,false),4000);

function dodge(e){
  if(e) e.preventDefault();
  n++;
  face.classList.remove('shake'); title.classList.remove('pop'); void face.offsetWidth;
  face.classList.add('shake'); title.classList.add('pop');
  setTimeout(()=>face.classList.remove('shake'),450);
  no.textContent=noText[n%noText.length];
  face.textContent=faces[n%faces.length];
  title.textContent=asks[Math.min(n-1,asks.length-1)];
  sub.textContent="Aanchal, will you be my girlfriend? 🥺";
  scale=Math.min(scale+0.22,2.4);
  yes.style.transform='scale('+scale+')';
  yes.style.margin=(scale*8)+'px '+(scale*14)+'px';
  // after enough tries, only "Yes" is left
  if(n>=7){
    no.classList.add('hidden');
    title.textContent="Okay, only one option left 😏";
    sub.textContent="Go on, press it 💖";
  }
}
no.addEventListener('click',dodge);

// little heart burst wherever she taps
function burst(x,y){
  for(let i=0;i<8;i++){
    const b=document.createElement('div');
    b.className='burst';
    b.textContent=['💖','✨','💕'][i%3];
    const a=Math.PI*2*i/8, d=40+Math.random()*30;
    b.style.left=x+'px'; b.style.top=y+'px';
    b.style.setProperty('--dx',Math.cos(a)*d+'px');
    b.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),800);
  }
}
document.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));

yes.addEventListener('click',()=>{
  document.getElementById('ask').classList.add('hidden');
  no.classList.add('hidden');
  document.getElementById('done').classList.remove('hidden');
  rain(80,true);
  setTimeout(()=>rain(60,true),1500);
});
</script>
